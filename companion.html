<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<script>
/* Хранилище компаньона внутри SillyTavern: вместо db/assets артефакта claude.ai.
   Данные: user/files/companion-db.json (+ копия за день), картинки: user/images/companion/. */
(function () {
  const P = window.parent !== window ? window.parent : null;
  const ctx = () => { try { return P && P.SillyTavern ? P.SillyTavern.getContext() : null; } catch (e) { return null; } };
  const headers = () => { const c = ctx(); return c ? c.getRequestHeaders() : { 'Content-Type': 'application/json' }; };
  const FILE = 'companion-db.json', IMG = 'companion';
  const S = {}, L = {};
  const clone = o => JSON.parse(JSON.stringify(o));
  const snap = c => { const docs = Object.keys(S[c] || {}).map(id => ({ id, exists: true, data: () => clone(S[c][id]), metadata: {} })); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [] }; };
  const fire = c => { (L[c] || []).forEach(f => { try { f(snap(c)); } catch (e) { console.error('[companion]', e); } }); try { P && P.dispatchEvent(new CustomEvent('companion-changed')); } catch (e) { /* нет */ } };
  const b64 = async blob => { const r = new FileReader(); return new Promise((ok, no) => { r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); }); };
  const ready = fetch('/user/files/' + FILE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null).then(j => { if (j && j.data) Object.assign(S, j.data); }).catch(() => {});
  let saveT = 0, dayCopy = '';
  async function put(name, text) {
    const r = await fetch('/api/files/upload', { method: 'POST', headers: headers(), body: JSON.stringify({ name, data: await b64(new Blob([text])) }) });
    if (!r.ok) throw new Error(r.status + ' ' + await r.text());
  }
  function persist() {
    clearTimeout(saveT);
    saveT = setTimeout(async () => {
      const text = JSON.stringify({ app: 'companion-st', version: 1, savedAt: new Date().toISOString(), data: S });
      try {
        await put(FILE, text);
        const d = new Date().toISOString().slice(0, 10);
        if (dayCopy !== d) { await put('companion-db-' + d + '.json', text); dayCopy = d; }
      } catch (e) { console.error('[companion] save failed', e); try { P.toastr.error('Компаньон: не сохранилось (' + e.message + ')'); } catch (er) { /* нет */ } }
    }, 400);
  }
  const db = {
    collection: c => ({
      onSnapshot: f => { (L[c] = L[c] || []).push(f); ready.then(() => f(snap(c))); return () => { L[c] = (L[c] || []).filter(x => x !== f); }; },
      doc: id => ({
        set: async d => { await ready; (S[c] = S[c] || {})[id] = clone(d); persist(); setTimeout(() => fire(c), 0); },
        update: async d => { await ready; if (!S[c] || !S[c][id]) throw { code: 'not_found' }; Object.assign(S[c][id], clone(d)); persist(); setTimeout(() => fire(c), 0); },
        delete: async () => { await ready; if (S[c]) delete S[c][id]; persist(); setTimeout(() => fire(c), 0); },
      }),
    }),
  };
  const EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' };
  const assets = {
    upload: async (blob, o) => {
      const type = (o && o.type) || blob.type || 'image/png', ext = EXT[type] || 'png';
      const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const r = await fetch('/api/images/upload', { method: 'POST', headers: headers(), body: JSON.stringify({ image: await b64(blob), format: ext, ch_name: IMG, filename: id }) });
      if (!r.ok) throw { code: 'upload_failed' };
      return { id, url: window.__cmpBlob(id), sizeBytes: blob.size, contentType: type };
    },
    delete: async id => { await fetch('/api/images/delete', { method: 'POST', headers: headers(), body: JSON.stringify({ path: 'user/images/' + IMG + '/' + (/\./.test(id) ? id : id + '.png') }) }); return { deleted: true }; },
  };
  const downloads = {
    save: async ({ filename, data }) => { const a = document.createElement('a'); a.href = URL.createObjectURL(data); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); },
  };
  /* картинки, перенесённые из артефакта, лежат как <id>.png */
  window.__cmpBlob = id => id ? '/user/images/' + IMG + '/' + (/\./.test(id) ? id : id + '.png') : '';
  window.claude = { use: async k => k === 'db' ? db : k === 'assets' ? assets : k === 'downloads' ? downloads : null };
})();
</script>
<title>Компаньон</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Fredoka:wght@500;600;700&family=Great+Vibes&family=Kaushan+Script&family=Lobster+Two:ital,wght@1,700&family=M+PLUS+Rounded+1c:wght@700;800&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@900&family=Pirata+One&family=Nunito:wght@400;600;700;800;900&family=Playball&family=Quicksand:wght@600;700&family=Special+Elite&family=VT323&family=Parisienne&family=Sacramento&family=Shadows+Into+Light&family=Permanent+Marker&family=Bebas+Neue&family=Abril+Fatface&family=Dela+Gothic+One&family=Playfair+Display:ital,wght@0,700;1,700;1,900&family=Yellowtail&family=Pacifico&family=Righteous&family=Monoton&family=Oswald:wght@700&family=Montserrat:wght@800&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Компаньон, вариант C «Пастель»: светлый серый фон, белые карточки, мягкие формы, маленькие кнопки-пилюли.
   Шапка с разделами; внутри сценария список героинь слева и анкета справа. Осознанно только светлая тема. */
:root{
  color-scheme:light;
  --bg:#EEEEF1; --surf:#FFFFFF; --surf2:#E5E5EA; --line:#DCDCE2; --fg:#2A2833; --fg2:#77737F;
  --acc:#E2677F; --acc-fg:#FFFFFF; --acc-soft:#FBE3E8; --ok:#2F8F6A; --warn:#B86E1C;
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --r-sm:9px; --pill:999px;
  --shadow:0 1px 2px rgba(42,40,51,.06),0 4px 14px rgba(42,40,51,.05);
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.55 var(--f-ui);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.who,.chip,.thumb{transition:background-color .15s,border-color .15s,box-shadow .15s}}

/* шапка */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surf);border-bottom:1px solid var(--line)}
.bar-in{max-width:1280px;margin-inline:auto;padding:8px 16px;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:7px;font-weight:700;font-size:15px;white-space:nowrap}
.logo i{font-style:normal;font-size:12px;color:var(--acc)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto}
.nav::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:5px 11px;border-radius:var(--pill);color:var(--fg2);font-size:12.5px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surf2);color:var(--fg)}
.tab[aria-current="page"]{background:var(--fg);color:var(--surf)}
.tab.add{color:var(--fg2);padding-inline:9px}
.sync{font:400 11px var(--f-mono);color:var(--fg2);white-space:nowrap}
.sync.bad{color:var(--warn)}

.wrap{max-width:1280px;margin-inline:auto;padding:18px 16px 64px}
.lab{font-size:10.5px;font-weight:500;letter-spacing:.03em;color:var(--fg2)}
.muted{color:var(--fg2)}
.mono{font-family:var(--f-mono)}
.btn{border:1px solid var(--line);background:var(--surf);border-radius:var(--pill);padding:3px 11px;font-size:12px;cursor:pointer;white-space:nowrap;min-height:28px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--fg2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none;color:var(--fg2)}
.btn.ghost:hover{color:var(--fg);background:var(--surf2)}
.btn.danger{color:#B2384F}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .sp{margin-left:auto}
.seg{display:inline-flex;background:var(--surf2);border-radius:var(--pill);padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:var(--pill);padding:3px 12px;font-size:12px;color:var(--fg2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--fg);box-shadow:var(--shadow);font-weight:500}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pad{padding:18px}
.empty{padding:28px 18px;text-align:center;color:var(--fg2);display:grid;gap:10px;justify-items:center}
.face{display:inline-block;border-radius:50%;flex:none;background-color:var(--surf2);background-repeat:no-repeat;vertical-align:middle}
.sh-face{display:flex;gap:14px;align-items:center}
.fc{position:relative;cursor:crosshair;user-select:none;-webkit-user-select:none;background:var(--bg);border-radius:var(--r-sm);overflow:hidden;justify-self:center;max-width:100%}
.fc img{display:block;max-width:100%;max-height:62vh;pointer-events:none}
#fc-r{accent-color:var(--acc)}
.fc svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vwm{padding:0!important;background:rgba(30,28,36,.55)}
.vw{position:fixed;inset:12px;background:var(--surf);border-radius:var(--r);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.vw-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.vw-top .kanji{font-size:22px;font-weight:700;line-height:1.1}
.vw-main{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
@media (min-width:900px){.vw-main{grid-template-columns:minmax(0,1fr) 280px}}
.vw-stage{position:relative;min-height:0;background:var(--bg);overflow:hidden;touch-action:none;cursor:grab}
.vw-stage.drag{cursor:grabbing}
.vw-stage img{position:absolute;left:12px;top:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vw-stage .empty-note{position:absolute;inset:0;display:grid;place-items:center}
.vw-zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;background:rgba(255,255,255,.92);border-radius:var(--pill);padding:3px;box-shadow:var(--shadow);z-index:2}
.vw-zoom button{min-width:30px;height:28px;border:0;border-radius:var(--pill);background:none;font:500 12px var(--f-ui);color:var(--fg);cursor:pointer;padding:0 8px}
.vw-zoom button:hover{background:var(--acc-soft)}
.vw-zoom span{align-self:center;font:400 11px var(--f-mono);color:var(--fg2);min-width:40px;text-align:center}
.vw-side{overflow:auto;padding:14px 16px;display:grid;gap:12px;align-content:start;border-left:1px solid var(--line)}
@media (max-width:899px){.vw-side{display:none}}
.vw-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-top:1px solid var(--line)}
.vw-strip button{position:relative;flex:none;border:2px solid transparent;border-radius:10px;padding:0;background:var(--bg);cursor:pointer;overflow:hidden;height:78px}
.vw-strip button[aria-pressed="true"]{border-color:var(--acc)}
.vw-strip img{height:100%;display:block}
.vw-strip span{position:absolute;left:4px;bottom:4px;background:rgba(255,255,255,.9);border-radius:var(--pill);padding:0 6px;font-size:10.5px}
.vw-strip .sep{width:1px;background:var(--line);flex:none;margin:4px 2px}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.slot{position:relative;aspect-ratio:5/7;border-radius:12px;overflow:hidden;border:0;padding:0;cursor:pointer;background:var(--surf);box-shadow:var(--shadow);font:inherit;color:inherit}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.empty{background:none;box-shadow:none;border:1.5px dashed var(--line);display:grid;place-content:center;justify-items:center;gap:6px;color:var(--fg2)}
.slot.empty:hover{border-color:var(--acc);background:var(--acc-soft)}
.slot.empty b{font:700 26px var(--f-mono);color:var(--line)}
.slot .no{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.9);border-radius:var(--pill);padding:0 7px;font:500 11px var(--f-mono)}
.slot .x{position:absolute;right:6px;top:6px;background:var(--acc);color:#fff;border-radius:var(--pill);padding:0 7px;font-size:11px}
.prog{height:6px;border-radius:3px;background:var(--surf2);overflow:hidden;width:160px}.prog i{display:block;height:100%;background:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:var(--pill);padding:1px 9px;font-size:11.5px;cursor:default;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--fg2)}
.chip.on,button.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:transparent;color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;min-width:0;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
textarea.code{font:12px/1.55 var(--f-mono)}
.fld{display:grid;gap:3px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--fg);color:var(--surf);padding:7px 14px;border-radius:var(--pill);font-size:12.5px;max-width:calc(100% - 32px);text-align:center}
.banner{background:var(--acc-soft);border-radius:var(--r-sm);padding:8px 12px;font-size:12.5px}

/* сценарий */
.scen-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:14px}
.scen-head h1{font-size:21px;font-weight:700;line-height:1.2;text-wrap:balance}
.scen-head .sp{margin-left:auto}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){.split{grid-template-columns:230px minmax(0,1fr)}}
.side{display:grid;gap:8px;align-content:start;min-width:0}
.list{display:grid;gap:2px}
@media (max-width:859px){.list{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}.list .who{flex:none}}
.who{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:var(--r-sm);border:0;background:none;cursor:pointer;text-align:left;min-width:0}
.who:hover{background:var(--surf2)}
.who[aria-current="true"]{background:var(--surf);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
.who b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .st{margin-left:auto;flex:none;width:8px;height:8px;border-radius:50%}
.st-wip{background:#E0A43A}.st-test{background:#6C8FD9}.st-final{background:#3FA37A}
.stsw{display:inline-flex;background:var(--surf2);border-radius:var(--pill);padding:3px;gap:2px;position:relative}
.stsw button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:var(--pill);padding:4px 11px;font:500 11.5px var(--f-ui);color:var(--fg2);cursor:pointer;transition:background-color .2s,color .2s,box-shadow .2s}
.stsw button i{width:8px;height:8px;border-radius:50%;opacity:.45;transition:opacity .2s,transform .2s}
.stsw button:hover{color:var(--fg)}
.stsw button[aria-pressed="true"]{background:var(--surf);color:var(--fg);box-shadow:var(--shadow)}
.stsw button[aria-pressed="true"] i{opacity:1;transform:scale(1.25)}
.stsw button{white-space:nowrap}
p .lnk{border:0;background:none;padding:0;font:inherit;color:var(--acc);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sh-no{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.av{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover;background:var(--surf2)}

.sheet{display:grid;gap:0}
.sh-head{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-start;padding:18px}
.cover{width:92px;aspect-ratio:3/4;border-radius:var(--r-sm);object-fit:cover;background:var(--surf2);flex:none;cursor:pointer}
.sh-name{display:grid;gap:2px;min-width:0;flex:1 1 220px}
.kanji{font-size:28px;font-weight:700;line-height:1.15}
.romaji em{font-style:normal;color:var(--acc);font-weight:700}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:grid;justify-items:center;gap:2px}
.sw i{display:block;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}
.sec{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.sec h3{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--fg2)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px 14px}
.stat{display:grid;gap:1px;min-width:0}
.stat .v{font-size:13.5px;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.rows{display:grid;gap:9px}
.frow{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
@media (min-width:640px){.frow{grid-template-columns:120px minmax(0,1fr);gap:12px}}
.frow .v{overflow-wrap:anywhere;white-space:pre-wrap}
.scales{display:grid;gap:6px}
.sc{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:10px}
.meter{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.meter i{width:18px;height:6px;background:var(--surf2);border-radius:var(--pill)}
.meter i.on{background:var(--acc)}
.meter span{margin-left:8px;font-size:11.5px;color:var(--fg2)}
.meter button{border:0;padding:6px 0;background:none;cursor:pointer}
.meter button i{display:block}
.ref{display:block;width:100%;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;background:var(--bg);max-width:100%}
.ref img{width:100%;height:100%;object-fit:contain;display:block}
.empty-ref{aspect-ratio:auto;min-height:96px;border:1.5px dashed var(--line);display:grid;place-content:center;justify-items:center;gap:4px;cursor:pointer;font:inherit;color:var(--fg)}

.outs{display:inline-flex;gap:4px}
.outs button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font:500 12px var(--f-ui);color:var(--fg);cursor:pointer;padding:0}
.outs button.none{color:var(--fg2);border-style:dashed;background:none}
.outs button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--surf)}
.outlabel{width:auto;max-width:200px;min-height:28px;padding:3px 10px;font-size:12.5px;border-radius:var(--pill)}
.lineup{position:relative;overflow-x:auto;overflow-y:hidden;background:var(--surf);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 20px 0 44px}
.lu-in{position:relative;display:flex;align-items:flex-end;gap:14px;min-width:max-content}
.lu-grid{position:absolute;left:-44px;right:0;bottom:0;pointer-events:none}

.sw{
  display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface);
}
.sw i{
  flex:none; width:34px; aspect-ratio:1; border-radius:50%;
  background:linear-gradient(135deg,var(--a) 0 50%,var(--b) 50% 100%); box-shadow:inset 0 0 0 4px var(--f);
}
.sw b{font-size:14px; line-height:1.2}
.swatches input:checked + .sw{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent)}
.swatches input:focus-visible + .sw{outline:2px solid var(--fg); outline-offset:2px}

.check{display:flex; align-items:center; gap:10px; min-height:44px; font-weight:600; cursor:pointer}
.check input{width:20px; height:20px; accent-color:var(--accent); margin:0}

.lightbox{
  position:fixed; inset:0; z-index:50; background:var(--scrim); display:grid;
  grid-template-rows:minmax(0,1fr) auto; gap:10px;
  padding:calc(56px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.lightbox img{width:100%; height:100%; min-height:0; object-fit:contain}
.lightbox p{color:var(--scrim-fg); text-align:center; font-size:14px}
.lb-close{
  position:absolute; top:calc(8px + env(safe-area-inset-top,0px)); right:12px; width:44px; height:44px;
  border-radius:50%; border:0; background:var(--surface); color:var(--fg); cursor:pointer;
  display:grid; place-items:center;
}
.toast{
  position:fixed; left:50%; transform:translateX(-50%); z-index:60; max-width:calc(100% - 32px);
  bottom:calc(16px + env(safe-area-inset-bottom,0px)); background:var(--fg); color:var(--bg);
  padding:10px 16px; border-radius:12px; font-weight:600; text-align:center;
}

@media (min-width:880px){
  .app{grid-template-columns:minmax(320px,440px) minmax(0,1fr); gap:20px 40px; align-items:start; padding-block:28px 72px}
  .head{grid-column:1/-1}
  .stage{
    top:calc(env(safe-area-inset-top,0px) + 16px); background:var(--stage); border-radius:20px;
    padding:22px 20px 18px; box-shadow:none;
  }
  #card{max-height:calc(100vh - 190px)}
  .group:first-child{border-top:0; padding-top:0}
}
:host{--bg:#EEEEF1;--surface:#FFFFFF;--stage:#E5E5EA;--fg:#2A2833;--muted:#77737F;--line:#DCDCE2;--accent:#E2677F;--accent-fg:#FFFFFF;
  --font-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;--font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  font-size:13px;color-scheme:light}
.head{display:none}
.app{padding-block:4px 56px}
.group h2,.tabp h3{font:700 15px/1.3 var(--font-body);font-style:normal}
.btn{min-height:32px;padding:0 14px;border-radius:999px;font:500 12.5px var(--font-body)}
.btn.sm{min-height:30px;font-size:12px}
.tab{min-height:32px;padding:0 14px;font:500 12.5px var(--font-body)}
.seg{border-radius:999px}
.seg span{min-height:32px;font-size:12px;font-weight:500}
.tints span{min-width:34px;height:34px}
.pc input{width:34px;height:34px}
.pp{min-height:34px;font-weight:500}
.fo{min-height:60px;border-radius:12px}
.sw{border-radius:12px}
.check{min-height:34px;font-weight:500;font-size:13px}
input[type=text],textarea,select{font-size:13px;min-height:34px;padding:6px 10px;border-radius:9px}
.lbl,.field>label,legend{font-weight:500;font-size:11px}
.link{font:500 12.5px var(--font-body)}
.drop{border-radius:14px}
:host([hidden]){display:none!important}
.stage{top:var(--bar-h,0px)}
.slider input[type=range]{-webkit-appearance:none;appearance:none;height:32px;background:transparent}
.slider input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--line,#e2e2e8)}
.slider input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line,#e2e2e8)}
.slider input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.slider input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.slider input[type=range]:disabled{opacity:.45}
@media (min-width:880px){.stage{top:calc(var(--bar-h,0px) + 12px);border-radius:14px}}

/* Мост для расширения ST: состояние дня текстом для промпта. Вставляется в конец основного скрипта компаньона. */
window.companionState = function () {
  const s = scen(); if (!s) return null;
  const T = todayInfo(s); if (!T) return { scenario: s.name || '', text: '' };
  const hs = hersIn(s.id), nm = h => h.nick || h.name || '?';
  const ph = h => { if (isPreg(h)) { const w = pregWeek(s, h); return 'pregnant' + (w ? ' (week ' + w + ')' : ''); } const p = phaseAt(s, h, T.o); return p ? PH[p.k][0] + ' ' + PH[p.k][1] + (p.k === 'ovu' ? ' (fertile, high chance)' : '') : 'cycle unknown'; };
  const cnts = s.counters || [];
  const lines = [];
  const [m, d] = T.k.split('-').map(Number), mon = (CAL_ALL.find(x => x[3] === m) || [])[0] || '';
  lines.push('Today in game: ' + ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][wdOf(s, T.o)] + ', ' + d + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][m - 1] + '.');
  if (T.t) lines.push('Day type: ' + (T.t.emoji ? T.t.emoji + ' ' : '') + (T.t.label || '') + (T.t.rule ? '. Rule of the day: ' + T.t.rule : '') + '.');
  const duty = T.her.map(herOf).filter(Boolean);
  if (duty.length) duty.forEach(h => {
    const c = cnts.map(x => ((h.cnt || {})[x.key] || 0) ? x.label + ' ' + h.cnt[x.key] : '').filter(Boolean).join(', ');
    lines.push('Duty student: ' + nm(h) + ' — ' + ph(h) + '; duties so far: ' + dutyOf(s, h.id) + (c ? '; ' + c : '') + '.');
  });
  else lines.push('Duty student: not chosen yet.');
  const ovu = hs.filter(h => !T.her.includes(h.id) && !isPreg(h) && (phaseAt(s, h, T.o) || {}).k === 'ovu').map(nm);
  if (ovu.length) lines.push('Also ovulating today: ' + ovu.join(', ') + '.');
  const preg = hs.filter(h => !T.her.includes(h.id) && isPreg(h)).map(h => nm(h) + (pregWeek(s, h) ? ' (week ' + pregWeek(s, h) + ')' : ''));
  if (preg.length) lines.push('Pregnant: ' + preg.join(', ') + '.');
  return { scenario: s.name || '', key: T.k, duty: duty.map(nm), text: lines.join('\n') };
};
